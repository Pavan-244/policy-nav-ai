<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantum Education Policies - Policy Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='favicon.svg') }}">
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1 class="title">Quantum Education</h1>
            <p class="subtitle">Emerging frameworks for quantum learning and advanced curricula.</p>
        </header>

        <section class="search-area" aria-label="Search quantum education policies">
            <form hx-post="/search/{{ model_key }}" hx-target="#results-container" hx-swap="innerHTML" hx-indicator="#loading-spinner">
                <input id="query-input" name="query" type="search" placeholder="Search quantum education policies..." value="quantum education policies" />
                <button type="submit">Search</button>
            </form>
            <div class="below-form-center">
                <a class="card-btn secondary" href="/visualize/{{ model_key }}">Visualize dataset</a>
            </div>
        </section>

        <div id="loading-spinner" class="htmx-indicator">
            <div class="spinner"></div>
            <p>Searching quantum education policies...</p>
        </div>

        <div id="results-container" class="results">
            <!-- Quantum-specific results will be rendered here by HTMX -->
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-title">PolicyNav</p>
            <p class="footer-text">AI-powered public policy navigation across multiple sectors</p>
            <p class="footer-copyright">&copy; 2025 PolicyNav. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
