<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolicyNav Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='favicon.svg') }}">
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1/build/d3.layout.cloud.js"></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1 class="title">Dataset Visualization</h1>
      <p class="subtitle">Interactively explore <strong>{{ model_key }}</strong> dataset columns and summaries.</p>
    </header>

    <section class="viz-tabs">
      <div class="tabs">
        <button class="tab active" data-tab="summary">Summary</button>
        <button class="tab" data-tab="wordcloud">Word Cloud</button>
        <button class="tab" data-tab="related">Related Graph</button>
      </div>
    </section>

    <section class="tab-panels">
      <div class="tab-panel active" id="panel-summary">
        <div class="viz-controls">
          <div class="control">
            <label for="columnSelect">Column</label>
            <select id="columnSelect"></select>
          </div>
          <div class="control">
            <label for="chartType">Chart type</label>
            <select id="chartType">
              <option value="bar">Bar</option>
              <option value="line">Line</option>
              <option value="pie">Pie</option>
            </select>
          </div>
          <div class="control">
            <label for="topN">Top N / Bins</label>
            <input id="topN" type="number" min="5" max="50" value="10" />
          </div>
          <button id="updateBtn" class="card-btn">Update</button>
        </div>

        <section class="viz-canvas">
          <canvas id="chartCanvas" height="140"></canvas>
        </section>

        <section class="viz-table">
          <table id="summaryTable">
            <thead><tr><th>Value</th><th>Count</th></tr></thead>
            <tbody></tbody>
          </table>
        </section>
      </div>

      <div class="tab-panel" id="panel-wordcloud">
        <div class="viz-controls">
          <div class="control">
            <label for="wcColumn">Text column</label>
            <select id="wcColumn"></select>
          </div>
          <div class="control">
            <label for="wcTop">Top words</label>
            <input id="wcTop" type="number" min="20" max="200" value="80" />
          </div>
          <div class="control">
            <label for="wcMinLen">Min length</label>
            <input id="wcMinLen" type="number" min="2" max="8" value="3" />
          </div>
          <button id="wcUpdate" class="card-btn">Build Word Cloud</button>
        </div>
        <div class="svg-box"><svg id="wcSvg" width="900" height="380"></svg></div>
      </div>

      <div class="tab-panel" id="panel-related">
        <div class="viz-controls">
          <div class="control">
            <label for="relColumn">Text column</label>
            <select id="relColumn"></select>
          </div>
          <div class="control">
            <label for="relTop">Top terms</label>
            <input id="relTop" type="number" min="10" max="100" value="40" />
          </div>
          <div class="control">
            <label for="relMinLen">Min length</label>
            <input id="relMinLen" type="number" min="2" max="8" value="3" />
          </div>
          <div class="control">
            <label for="relMinCooc">Min co-occ</label>
            <input id="relMinCooc" type="number" min="1" max="20" value="2" />
          </div>
          <button id="relUpdate" class="card-btn">Build Graph</button>
        </div>
        <div class="svg-box"><svg id="graphSvg" width="900" height="420"></svg></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="footer-title">PolicyNav</p>
      <p class="footer-text">AI-powered public policy navigation across multiple sectors</p>
      <p class="footer-copyright">&copy; 2025 PolicyNav. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const modelKey = "{{ model_key }}";
    // Summary controls
    const columnSelect = document.getElementById('columnSelect');
    const chartTypeEl = document.getElementById('chartType');
    const topNEl = document.getElementById('topN');
    const updateBtn = document.getElementById('updateBtn');
    const tableBody = document.querySelector('#summaryTable tbody');
    // NLP controls
    const wcColumn = document.getElementById('wcColumn');
    const wcTop = document.getElementById('wcTop');
    const wcMinLen = document.getElementById('wcMinLen');
    const wcUpdate = document.getElementById('wcUpdate');
    const relColumn = document.getElementById('relColumn');
    const relTop = document.getElementById('relTop');
    const relMinLen = document.getElementById('relMinLen');
    const relMinCooc = document.getElementById('relMinCooc');
    const relUpdate = document.getElementById('relUpdate');
    let chart;

    async function fetchColumns() {
      const res = await fetch(`/api/visualize/${modelKey}/columns`);
      const data = await res.json();
      const cols = data.columns || [];
      const fill = (selectEl) => {
        selectEl.innerHTML = '';
        cols.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = `${c.name} (${c.type})`;
          selectEl.appendChild(opt);
        });
      };
      fill(columnSelect);
      fill(wcColumn);
      fill(relColumn);
    }

    async function fetchSummary() {
      const column = columnSelect.value;
      const chartType = chartTypeEl.value;
      const top = parseInt(topNEl.value || '10', 10);
      const qs = new URLSearchParams({ column, top, chartType });
      const res = await fetch(`/api/visualize/${modelKey}/summary?${qs.toString()}`);
      return await res.json();
    }

    function renderTable(rows) {
      tableBody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.label}</td><td>${r.value}</td>`;
        tableBody.appendChild(tr);
      });
    }

    function renderChart(payload) {
      const ctx = document.getElementById('chartCanvas').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: payload.chartType || 'bar',
        data: {
          labels: payload.labels,
          datasets: [{
            label: payload.title || 'Summary',
            data: payload.values,
            backgroundColor: 'rgba(52,152,219,0.5)',
            borderColor: '#2980b9',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: payload.chartType === 'pie' ? {} : {
            y: { beginAtZero: true }
          }
        }
      });
    }

    async function updateVisualization() {
      const data = await fetchSummary();
      renderChart(data);
      renderTable(data.rows || []);
    }

    updateBtn.addEventListener('click', updateVisualization);

    // Word Cloud
    async function buildWordCloud() {
      const col = wcColumn.value;
      const top = parseInt(wcTop.value || '80', 10);
      const minLen = parseInt(wcMinLen.value || '3', 10);
      const qs = new URLSearchParams({ column: col, top, min_len: minLen });
      const res = await fetch(`/api/visualize/${modelKey}/nlp/terms?${qs.toString()}`);
      const data = await res.json();
      const svg = d3.select('#wcSvg');
      const width = parseInt(svg.attr('width'));
      const height = parseInt(svg.attr('height'));
      svg.selectAll('*').remove();
      const values = data.terms.map(d => d.value);
      const max = d3.max(values) || 1;
      const size = d3.scaleSqrt().domain([1, max]).range([10, 50]);
      const layout = d3.layout.cloud()
        .size([width, height])
        .words(data.terms.map(d => ({ text: d.text, size: size(d.value) })))
        .padding(2)
        .rotate(() => ~~(Math.random() * 2) * 90)
        .font('Poppins')
        .fontSize(d => d.size)
        .on('end', draw);
      layout.start();
      function draw(words) {
        svg.append('g')
          .attr('transform', `translate(${width / 2}, ${height / 2})`)
          .selectAll('text')
          .data(words)
          .enter().append('text')
          .style('font-family', 'Poppins')
          .style('fill', (d, i) => d3.interpolateBlues(i / words.length))
          .style('font-size', d => d.size + 'px')
          .attr('text-anchor', 'middle')
          .attr('transform', d => `translate(${[d.x, d.y]})rotate(${d.rotate})`)
          .text(d => d.text);
      }
    }
    document.getElementById('wcUpdate').addEventListener('click', buildWordCloud);

    // Related Graph (co-occurrence)
    async function buildRelatedGraph() {
      const col = relColumn.value;
      const top = parseInt(relTop.value || '40', 10);
      const minLen = parseInt(relMinLen.value || '3', 10);
      const minCooc = parseInt(relMinCooc.value || '2', 10);
      const qs = new URLSearchParams({ column: col, top_terms: top, min_len: minLen, min_cooc: minCooc });
      const res = await fetch(`/api/visualize/${modelKey}/nlp/cooc?${qs.toString()}`);
      const data = await res.json();
      const svg = d3.select('#graphSvg');
      const width = parseInt(svg.attr('width'));
      const height = parseInt(svg.attr('height'));
      svg.selectAll('*').remove();
      const radius = d3.scaleSqrt().domain([1, d3.max(data.nodes, d => d.value) || 1]).range([4, 18]);
      const linkWidth = d3.scaleLinear().domain([1, d3.max(data.links, d => d.value) || 1]).range([0.5, 3]);

      const simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(d => 120 - Math.min(100, (d.value||1)*2)))
        .force('charge', d3.forceManyBody().strength(-120))
        .force('center', d3.forceCenter(width/2, height/2));

      const g = svg.append('g');
      const links = g.selectAll('line')
        .data(data.links)
        .enter().append('line')
        .attr('stroke', '#9bbad6')
        .attr('stroke-width', d => linkWidth(d.value));

      const node = g.selectAll('g.node')
        .data(data.nodes)
        .enter().append('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

      node.append('circle')
        .attr('r', d => radius(d.value))
        .attr('fill', '#2d8ae0');

      node.append('text')
        .attr('x', 8)
        .attr('y', 3)
        .text(d => d.label)
        .style('font-size', '11px')
        .style('font-family', 'Poppins')
        .style('fill', '#2c3e50');

      simulation.on('tick', () => {
        links
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        node
          .attr('transform', d => `translate(${d.x},${d.y})`);
      });
    }
    document.getElementById('relUpdate').addEventListener('click', buildRelatedGraph);

    // Tabs
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const panels = {
      summary: document.getElementById('panel-summary'),
      wordcloud: document.getElementById('panel-wordcloud'),
      related: document.getElementById('panel-related'),
    };
    tabs.forEach(btn => btn.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      Object.values(panels).forEach(p => p.classList.remove('active'));
      panels[btn.dataset.tab].classList.add('active');
    }));

    (async function init() {
      await fetchColumns();
      if (columnSelect.options.length > 0) {
        columnSelect.selectedIndex = 0;
        wcColumn.selectedIndex = 0;
        relColumn.selectedIndex = 0;
        await updateVisualization();
        await buildWordCloud();
        await buildRelatedGraph();
      }
    })();
  </script>
</body>
</html>
